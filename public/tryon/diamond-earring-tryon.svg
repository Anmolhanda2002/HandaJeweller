<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="120" height="200">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805210" />
    </linearGradient>
    <!-- Diamond Shimmer -->
    <radialGradient id="diamondGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#E8F4F8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#BEE3F8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#63B3ED" stop-opacity="0.5" />
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="jewelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#jewelShadow)">
    <!-- Earring Post & Top Stud -->
    <circle cx="60" cy="25" r="14" fill="url(#goldGrad)" stroke="#AA771C" stroke-width="1.5" />
    <polygon points="60,15 68,25 60,35 52,25" fill="url(#diamondGrad)" />
    <circle cx="60" cy="25" r="3" fill="#FFFFFF" />

    <!-- Connecting Gold Link -->
    <path d="M 60,39 L 60,52" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <circle cx="60" cy="46" r="2.5" fill="#FFF3B0" />

    <!-- Middle Diamond Halo Clustered Element -->
    <circle cx="60" cy="65" r="10" fill="url(#goldGrad)" />
    <polygon points="60,58 66,65 60,72 54,65" fill="url(#diamondGrad)" />

    <!-- Secondary Link -->
    <path d="M 60,75 L 60,88" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Pear-Cut Solitaire Teardrop Jewel -->
    <!-- Gold Outer Bezel -->
    <path d="M 60,88 C 76,115 88,145 88,162 C 88,180 75,195 60,195 C 45,195 32,180 32,162 C 32,145 44,115 60,88 Z" fill="url(#goldGrad)" stroke="#805210" stroke-width="2" />

    <!-- Pear Diamond Inner Facets -->
    <path d="M 60,96 C 72,120 81,146 81,160 C 81,174 71,187 60,187 C 49,187 39,174 39,160 C 39,146 48,120 60,96 Z" fill="url(#diamondGrad)" />

    <!-- Brilliant Facet Cuts -->
    <polygon points="60,105 70,140 60,175 50,140" fill="#FFFFFF" fill-opacity="0.6" />
    <polygon points="60,175 75,160 70,140" fill="#E8F4F8" fill-opacity="0.5" />
    <polygon points="60,175 45,160 50,140" fill="#E8F4F8" fill-opacity="0.5" />
    <circle cx="60" cy="142" r="3" fill="#FFFFFF" />

    <!-- Sparkle Accent -->
    <path d="M 60,132 L 62,140 L 70,142 L 62,144 L 60,152 L 58,144 L 50,142 L 58,140 Z" fill="#FFFFFF" fill-opacity="0.9" />
  </g>
</svg>
