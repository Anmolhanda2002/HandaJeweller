<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 350" width="200" height="350" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#DFAC42"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="75%" stop-color="#DFAC42"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>

    <radialGradient id="rubyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="70%" stop-color="#B30026"/>
      <stop offset="100%" stop-color="#5B0014"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#50E3C2"/>
      <stop offset="70%" stop-color="#0E8A68"/>
      <stop offset="100%" stop-color="#043D2D"/>
    </radialGradient>

    <radialGradient id="pearlShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#D9C9A8"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="jewelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#jewelShadow)">
    <!-- Top Hairpin / Hook -->
    <path d="M 100,5 C 95,5 93,12 97,16 C 101,20 100,28 100,35" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="8" r="4" fill="url(#pearlShine)"/>

    <!-- Central Pearl/Gold String (Chain) -->
    <line x1="100" y1="35" x2="100" y2="170" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>
    
    <!-- Pearls along chain -->
    <circle cx="100" cy="45" r="4.5" fill="url(#pearlShine)"/>
    <circle cx="100" cy="65" r="5" fill="url(#pearlShine)"/>
    <circle cx="100" cy="85" r="5.5" fill="url(#rubyGlow)"/>
    <circle cx="100" cy="105" r="5" fill="url(#pearlShine)"/>
    <circle cx="100" cy="125" r="5.5" fill="url(#pearlShine)"/>
    <circle cx="100" cy="145" r="6" fill="url(#rubyGlow)"/>
    <circle cx="100" cy="165" r="6.5" fill="url(#pearlShine)"/>

    <!-- Gold connector caps on pearls -->
    <path d="M 97,42 Q 100,44 103,42" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <path d="M 97,62 Q 100,64 103,62" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <path d="M 97,82 Q 100,84 103,82" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <path d="M 97,102 Q 100,104 103,102" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <path d="M 97,122 Q 100,124 103,122" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
    <path d="M 96,142 Q 100,144 104,142" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>

    <!-- Transition Filigree Ornament -->
    <path d="M 88,175 C 92,168 108,168 112,175 C 116,183 84,183 88,175 Z" fill="url(#goldGradient)"/>
    <circle cx="100" cy="176" r="3" fill="url(#rubyGlow)"/>

    <!-- Main Tikka Pendant Outer Medallion -->
    <!-- Outer Kundan Petals / Aura -->
    <g transform="translate(100, 235)">
      <!-- Radiating Gold Lotus Leaves -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
      <circle cx="0" cy="0" r="48" fill="#1A140B" stroke="url(#goldGradient)" stroke-width="1.5"/>

      <!-- 12 Petal Kundan Surround -->
      <path d="M 0,-54 C 4,-48 4,-46 0,-44 C -4,-46 -4,-48 0,-54 Z" fill="url(#pearlShine)"/>
      <path d="M 27,-46 C 30,-39 28,-37 25,-37 C 22,-37 21,-40 27,-46 Z" fill="url(#pearlShine)"/>
      <path d="M 46,-27 C 46,-20 44,-19 41,-21 C 38,-23 40,-27 46,-27 Z" fill="url(#pearlShine)"/>
      <path d="M 54,0 C 48,4 46,4 44,0 C 46,-4 48,-4 54,0 Z" fill="url(#pearlShine)"/>
      <path d="M 46,27 C 40,27 38,23 41,21 C 44,19 46,20 46,27 Z" fill="url(#pearlShine)"/>
      <path d="M 27,46 C 21,40 22,37 25,37 C 28,37 30,39 27,46 Z" fill="url(#pearlShine)"/>
      <path d="M 0,54 C -4,48 -4,46 0,44 C 4,46 4,48 0,54 Z" fill="url(#pearlShine)"/>
      <path d="M -27,46 C -30,39 -28,37 -25,37 C -22,37 -21,40 -27,46 Z" fill="url(#pearlShine)"/>
      <path d="M -46,27 C -46,20 -44,19 -41,21 C -38,23 -40,27 -46,27 Z" fill="url(#pearlShine)"/>
      <path d="M -54,0 C -48,-4 -46,-4 -44,0 C -46,4 -48,4 -54,0 Z" fill="url(#pearlShine)"/>
      <path d="M -46,-27 C -40,-27 -38,-23 -41,-21 C -44,-19 -46,-20 -46,-27 Z" fill="url(#pearlShine)"/>
      <path d="M -27,-46 C -21,-40 -22,-37 -25,-37 C -28,-37 -30,-39 -27,-46 Z" fill="url(#pearlShine)"/>

      <!-- Inner Filigree Gold Ring -->
      <circle cx="0" cy="0" r="38" fill="url(#goldGradient)"/>
      <circle cx="0" cy="0" r="34" fill="#2A080C"/>

      <!-- Ruby Halo Stones -->
      <circle cx="0" cy="-26" r="4" fill="url(#rubyGlow)"/>
      <circle cx="18" cy="-18" r="4" fill="url(#rubyGlow)"/>
      <circle cx="26" cy="0" r="4" fill="url(#rubyGlow)"/>
      <circle cx="18" cy="18" r="4" fill="url(#rubyGlow)"/>
      <circle cx="0" cy="26" r="4" fill="url(#rubyGlow)"/>
      <circle cx="-18" cy="18" r="4" fill="url(#rubyGlow)"/>
      <circle cx="-26" cy="0" r="4" fill="url(#rubyGlow)"/>
      <circle cx="-18" cy="-18" r="4" fill="url(#rubyGlow)"/>

      <!-- Centerpiece Royal Emerald / Kundan Gem -->
      <circle cx="0" cy="0" r="18" fill="url(#goldGradient)"/>
      <polygon points="0,-14 10,-7 10,7 0,14 -10,7 -10,-7" fill="url(#emeraldGlow)" stroke="#FFF3B0" stroke-width="1"/>
      <circle cx="0" cy="0" r="6" fill="url(#pearlShine)"/>
    </g>

    <!-- Dangling Pearls / Jhumki drops beneath pendant -->
    <!-- Left drop 1 -->
    <line x1="68" y1="270" x2="65" y2="295" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="65" cy="298" r="4.5" fill="url(#pearlShine)"/>
    <circle cx="64" cy="306" r="3" fill="url(#goldGradient)"/>

    <!-- Left drop 2 -->
    <line x1="82" y1="282" x2="80" y2="312" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="80" cy="315" r="5" fill="url(#rubyGlow)"/>
    <circle cx="79" cy="324" r="3.5" fill="url(#pearlShine)"/>

    <!-- Center drop (main dangling pearl) -->
    <line x1="100" y1="288" x2="100" y2="322" stroke="url(#goldGradient)" stroke-width="2"/>
    <circle cx="100" cy="326" r="6.5" fill="url(#pearlShine)"/>
    <circle cx="100" cy="336" r="4" fill="url(#rubyGlow)"/>

    <!-- Right drop 2 -->
    <line x1="118" y1="282" x2="120" y2="312" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="120" cy="315" r="5" fill="url(#rubyGlow)"/>
    <circle cx="121" cy="324" r="3.5" fill="url(#pearlShine)"/>

    <!-- Right drop 1 -->
    <line x1="132" y1="270" x2="135" y2="295" stroke="url(#goldGradient)" stroke-width="1.5"/>
    <circle cx="135" cy="298" r="4.5" fill="url(#pearlShine)"/>
    <circle cx="136" cy="306" r="3" fill="url(#goldGradient)"/>
  </g>
</svg>
