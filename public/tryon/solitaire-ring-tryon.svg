<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="platBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#805210" />
    </linearGradient>
    <radialGradient id="ringSolitaire" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F0F9FF" />
      <stop offset="70%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </radialGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#ringShadow)">
    <!-- Ring Band Loop -->
    <ellipse cx="80" cy="100" rx="42" ry="32" fill="none" stroke="url(#goldBand)" stroke-width="12" stroke-linecap="round" />
    <!-- Inner Band Highlight -->
    <ellipse cx="80" cy="98" rx="38" ry="28" fill="none" stroke="#FFF3B0" stroke-width="2" opacity="0.6" />

    <!-- 6-Prong Diamond Setting Mount -->
    <path d="M 68,76 L 62,56 L 68,52" fill="none" stroke="url(#platBand)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 92,76 L 98,56 L 92,52" fill="none" stroke="url(#platBand)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 80,78 L 80,50" fill="none" stroke="url(#platBand)" stroke-width="3" stroke-linecap="round" />

    <!-- Brilliant Solitaire Diamond (Top View / Isometric Angle) -->
    <g transform="translate(80, 48)">
      <!-- Outer Pavilion & Crown -->
      <polygon points="0,-24 24,-12 30,10 14,24 -14,24 -30,10 -24,-12" fill="url(#ringSolitaire)" stroke="#94A3B8" stroke-width="1" />
      <!-- Table Facet (Octagonal) -->
      <polygon points="0,-16 14,-8 18,6 8,16 -8,16 -18,6 -14,-8" fill="#FFFFFF" fill-opacity="0.9" />
      <!-- Star Facets -->
      <polygon points="0,-24 0,-16 14,-8 24,-12" fill="#E0F2FE" fill-opacity="0.7" />
      <polygon points="24,-12 14,-8 18,6 30,10" fill="#BAE6FD" fill-opacity="0.6" />
      <polygon points="0,-24 0,-16 -14,-8 -24,-12" fill="#FFFFFF" fill-opacity="0.8" />
      <!-- Intense Brilliance Sparkle Flare -->
      <circle cx="-4" cy="-4" r="3.5" fill="#FFFFFF" />
      <path d="M -4,-12 L -2,-5 L 5,-4 L -2,-3 L -4,4 L -6,-3 L -13,-4 L -6,-5 Z" fill="#FFFFFF" fill-opacity="0.95" />
    </g>

    <!-- Platinum Prongs Over Diamond -->
    <circle cx="62" cy="56" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8" />
    <circle cx="98" cy="56" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8" />
    <circle cx="80" cy="72" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8" />
    <circle cx="80" cy="24" r="3" fill="#E2E8F0" stroke="#64748B" stroke-width="0.8" />
  </g>
</svg>
