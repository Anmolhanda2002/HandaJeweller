<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160">
  <defs>
    <linearGradient id="bangleGold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#805210" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF3B0" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#805210" />
    </linearGradient>
    <radialGradient id="bangleDiamond" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </radialGradient>
    <filter id="bangleShadow" x="-15%" y="-20%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#bangleShadow)">
    <!-- Back Arc of Bangle (Darker gold) -->
    <path d="M 30,80 C 30,55 80,35 140,35 C 200,35 250,55 250,80" fill="none" stroke="#78350F" stroke-width="14" stroke-linecap="round" />

    <!-- Front Arc of Bangle (Primary Highlighted Gold) -->
    <path d="M 250,80 C 250,115 200,135 140,135 C 80,135 30,115 30,80" fill="none" stroke="url(#bangleGold)" stroke-width="16" stroke-linecap="round" />

    <!-- Pavé Diamond Channel Setting in Front Arc -->
    <g fill="url(#bangleDiamond)" stroke="#AA771C" stroke-width="0.8">
      <circle cx="50" cy="94" r="3.5" />
      <circle cx="70" cy="106" r="4" />
      <circle cx="92" cy="116" r="4.2" />
      <circle cx="116" cy="123" r="4.5" />
      <circle cx="140" cy="125" r="5" />
      <circle cx="164" cy="123" r="4.5" />
      <circle cx="188" cy="116" r="4.2" />
      <circle cx="210" cy="106" r="4" />
      <circle cx="230" cy="94" r="3.5" />
    </g>

    <!-- Center Diamond Sparkle -->
    <circle cx="140" cy="125" r="2" fill="#FFFFFF" />
    <path d="M 140,118 L 141,123 L 146,125 L 141,127 L 140,132 L 139,127 L 134,125 L 139,123 Z" fill="#FFFFFF" />
  </g>
</svg>
